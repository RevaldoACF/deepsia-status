name: Response Time CI

on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-response-time
  cancel-in-progress: false

jobs:
  release:
    name: Update response time
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.46.5
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
